<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Apartman Dragićević</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#cd7442" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />
    <style>
      :root {
        color-scheme: light;
        --background: #faf7f1;
        --foreground: #2d211b;
        --muted: #7b6559;
        --accent: #cd7442;
        --border: #e8ddd2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at top left, rgba(205, 116, 66, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(45, 33, 27, 0.08), transparent 26%),
          var(--background);
        color: var(--foreground);
        font-family: Georgia, "Times New Roman", serif;
      }

      .card {
        width: min(100%, 40rem);
        padding: 3rem 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid var(--border);
        border-radius: 1.75rem;
        box-shadow: 0 24px 60px -32px rgba(45, 33, 27, 0.2);
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font: 700 0.8rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0 auto;
        max-width: 32rem;
        color: var(--muted);
        font: 500 1.1rem/1.7 system-ui, sans-serif;
      }

      .actions {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.95rem 1.5rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #e6864b, #cd7442);
        color: #fff;
        text-decoration: none;
        font: 600 1rem/1.2 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">404</p>
      <h1>Stranica nije pronađena</h1>
      <p>Link koji ste otvorili ne postoji ili je promenjen. Vratite se na početnu stranicu Apartmana Dragićević.</p>
      <div class="actions">
        <a class="button" href="/">Nazad na početnu</a>
      </div>
    </main>
  </body>
</html>
